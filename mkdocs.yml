site_name: uv-packsize
site_description: Measure the installed logical footprint of Python packages with uv.
site_url: https://kj-9.github.io/uv-packsize/
docs_dir: docs/user-guide
repo_url: https://github.com/kj-9/uv-packsize
repo_name: kj-9/uv-packsize
edit_uri: edit/main/docs/user-guide/

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.action.edit
    - navigation.footer
    - navigation.sections
    - navigation.tabs
    - search.highlight
    - search.share
    - toc.follow

extra_css:
  - assets/stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Guides:
      - Getting started: getting-started.md
      - Measuring packages: measuring-packages.md
      - Locked projects: locked-projects.md
      - Baselines and budgets: baselines-and-budgets.md
      - CI integration: ci.md
  - Reference:
      - Measurement contract: reference/measurement-contract.md
      - Safety and limitations: reference/safety-and-limitations.md
