name: Publish Python Package
on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.event.release.tag_name }}
        fetch-depth: 0
    - name: Set up Python
      uses: astral-sh/setup-uv@v7
      with:
        version: "0.11.3"
        python-version: "3.13"
        enable-cache: true
    - name: Verify release tag, source revision, and project version
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        expected_tag="v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
        test "$RELEASE_TAG" = "$expected_tag"
        test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
    - name: Verify lock and quality checks
      run: |
        uv lock --check
        make ci-check
  test:
    needs: [verify]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.event.release.tag_name }}
    - name: Set up Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v7
      with:
        version: "0.11.3"
        python-version: ${{ matrix.python-version }}
        enable-cache: true
    - name: Run tests
      run: |
        make test
  deploy:
    runs-on: ubuntu-latest
    needs: [verify, test]
    environment: release
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.event.release.tag_name }}
    - name: Set up Python
      uses: astral-sh/setup-uv@v7
      with:
        version: "0.11.3"
        python-version: "3.13"
        enable-cache: true
    - name: Build and verify
      run: |
        make verify-build
    - name: Publish
      uses: pypa/gh-action-pypi-publish@release/v1
