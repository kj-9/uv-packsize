name: CI

on: [push, pull_request]

permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.3"
      - name: Check lockfile
        run: uv lock --check
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.3"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Run tests
        run: |
          make test
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.3"
          python-version: "3.13"
          enable-cache: true
      - name: Run check
        run: make ci-check
